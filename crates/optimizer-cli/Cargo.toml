[package]
name = "optimizer-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "optimizer"
path = "src/main.rs"

[dependencies]
optimizer-core = { version = "0.1.0", path = "../optimizer-core" }
optimizer-cuda = { version = "0.1.0", path = "../optimizer-cuda" }
optimizer-experiment = { version = "0.1.0", path = "../optimizer-experiment" }
optimizer-extension = { version = "0.1.0", path = "../optimizer-extension" }
optimizer-highs = { version = "0.1.0", path = "../optimizer-highs" }
optimizer-lp = { version = "0.1.0", path = "../optimizer-lp" }
optimizer-lp-cuda = { version = "0.1.0", path = "../optimizer-lp-cuda" }
optimizer-schedule = { version = "0.1.0", path = "../optimizer-schedule" }
optimizer-registry = { version = "0.1.0", path = "../optimizer-registry" }
optimizer-schedule-examples = { version = "0.1.0", path = "../optimizer-schedule-examples" }
optimizer-solver = { version = "0.1.0", path = "../optimizer-solver" }
serde_json.workspace = true
serde.workspace = true
ctrlc = { version = "3.4", features = ["termination"] }

[lints]
workspace = true
