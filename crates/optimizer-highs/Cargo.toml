[package]
name = "optimizer-highs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
build = "build.rs"

# This crate owns the only native boundary in the workspace. ADR-0003 permits
# unsafe here and nowhere else, and a workspace-level `forbid` cannot be relaxed
# per crate, so the lints are declared explicitly instead of inherited.
[lints.rust]
unsafe_code = "allow"
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[lints.clippy]
all = "warn"

[features]
default = ["native"]
# Link the pinned HiGHS 1.11.0 CPU build when it is provisioned. Without it the
# safe contract still compiles and reports an unsupported backend.
native = []

[dependencies]
optimizer-core = { version = "0.1.0", path = "../optimizer-core" }

# C2 and C3 end-to-end acceptance lives here so optimizer-solver keeps its
# backend-neutrality guarantee: the executive must not depend on this crate.
# The first-order backend is a dev-dependency only. It is the differential
# oracle these tests compare against, and SPEC-0011 requirement 26 keeps it out
# of any production path: the fallback is this crate's own backend.
[dev-dependencies]
optimizer-lp = { version = "0.1.0", path = "../optimizer-lp" }
optimizer-extension = { version = "0.1.0", path = "../optimizer-extension" }
optimizer-extension-examples = { version = "0.1.0", path = "../optimizer-extension-examples" }
optimizer-schedule = { version = "0.1.0", path = "../optimizer-schedule" }
optimizer-schedule-examples = { version = "0.1.0", path = "../optimizer-schedule-examples" }
optimizer-solver = { version = "0.1.0", path = "../optimizer-solver" }