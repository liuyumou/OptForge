  # C6's line bundles two contracts that authorize different things, and
  # CONTRIBUTING.md mandates one complete vertical slice, so they are separated
  # without renumbering. SPEC-0010 owns heterogeneous computation itself and the
  # batched integer evaluator that is its first workload; SPEC-0011 owns the GPU
  # linear-programming backend, which needs a capability concept on the solve
  # contract that nothing in C1 through C8 required. Both are C6. The
  # specification key names the first, because it is the one the second depends
  # on for device selection, residency, lease ownership and fallback.
  # Both are now implemented with their evidence recorded, so this line closes. It
  # was kept as one id throughout for the reason that still applies to anyone
  # reading it later: splitting C6 in two would have let the finished half look
  # complete on its own, and the acceptance string below is one capability's --
  # the LP backend had to meet its equivalence and fallback parts too.
  #
  # The `in_progress` status this line carried while only one contract was done is
  # no longer used anywhere. It was a fourth value beside complete, ready and
  # planned, introduced deliberately rather than reusing `ready`, which would have
  # said the work had not started, or `complete`, which would have said it had
  # finished. Nothing parses this file, so the vocabulary is for a reader.
  - id: C6
    title: Heterogeneous backend and GPU feasibility
    status: complete
    depends_on: [C1, C4, C5]
    specification: docs/specifications/SPEC-0010-heterogeneous-computation.md
    acceptance: "CPU/GPU equivalence, sanitizers, lease recovery, fallback and transfer-inclusive measurements"
  - id: C7
    title: Adaptive portfolios and agent-developed algorithms
    status: planned
    depends_on: [C2, C3, C4, C5, C6]
    acceptance: "Held-out comparison, discovery cost, overhead, interaction and negative-result records"
  # C4 was one line covering four deliverables. The run surface is the
  # reproducibility spine the later items build on, so it ships first and the
  # registry, SDK and comparative runner keep their own specifications and gates.
  # C8's own line bundled three deliverables the same way. The registry is the
  # seam the other two build on and the one two recorded known-failures point at,
  # so C8 is now the registry alone under SPEC-0009, and the SDK and the
  # comparative runner become C9 and C10 with their own gates and their recorded
  # blockers. Existing references to "C8's registry" therefore stay accurate.
  - id: C8
