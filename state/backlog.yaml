research_phases:
  - "Adaptive portfolios and bounded agent-generated candidate/search advisers"
  # SPEC-0011 keeps this ordering in substance rather than skipping it: the CPU
  # first-order method is built first and is what the device kernels are checked
  # against, so it is a differential oracle rather than a preliminary step that
  # the device work replaces.
  - "CPU first-order LP as the oracle for, and therefore before, approximate GPU LP"
  - "Evidence-driven presolve, scaling, recovery, cuts, CPU parallelism, checkpointing"
  - "Python SDK and local extension registry after stable Rust contracts"
  - "Independent held-out evaluation, ablations, negative results, authorized release"
deferred:
