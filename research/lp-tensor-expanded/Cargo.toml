[package]
name = "lp-tensor-expanded-research"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "MIT"

# This research executable is isolated from public/default solver registrations.
[workspace]

[dependencies]
optimizer-core = { path = "../../crates/optimizer-core" }
optimizer-lp = { path = "../../crates/optimizer-lp", features = ["precision-research"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
