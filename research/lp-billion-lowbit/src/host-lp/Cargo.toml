[package]
name = "optimizer-lp-billion"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "MIT"
[lib]
path = "lib.rs"
[features]
precision-research = []
[dependencies]
optimizer-core = { path = "../../../../crates/optimizer-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
[lints.rust]
unsafe_code = "forbid"
[lints.clippy]
all = "warn"
